name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS only, on purpose: install.sh calls osacompile and codesign, and
    # the whole tool is Core Audio. There is nothing here a Linux runner could
    # meaningfully check.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show the interpreter
        run: python3 --version

      - name: Run the checks
        run: ./tools/check.sh

      # The runner ships a far newer python3 than a stock Mac does, so the
      # checks above would happily pass on syntax that fails for anyone using
      # the Command Line Tools interpreter. 3.9 is the documented floor, so
      # compile against it explicitly rather than trusting the runner.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Compile against the oldest supported interpreter
        run: |
          python --version
          python -m py_compile reset-audio
