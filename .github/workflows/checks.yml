name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS only, on purpose: install.sh calls osacompile and codesign, and
    # the whole tool is Core Audio. There is nothing here a Linux runner could
    # meaningfully check.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show the interpreter
        run: python3 --version

      - name: Run the checks
        run: ./tools/check.sh
