name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS only, on purpose: install.sh calls osacompile and codesign, and the
    # whole tool is Core Audio. There is nothing here a Linux runner could
    # meaningfully check.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # The runner has a much newer bash on its PATH than a Mac does, and
      # reset-audio is pinned to /bin/bash — which is still 3.2, and is what
      # anyone installing this will actually run it under. Print both so a
      # failure that only happens on one of them is not a mystery.
      - name: Show the shells
        run: |
          echo "PATH bash:   $(bash --version | head -1)"
          echo "/bin/bash:   $(/bin/bash --version | head -1)"

      - name: Run the checks
        run: ./tools/check.sh
